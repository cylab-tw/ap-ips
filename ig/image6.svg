</text></g><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(932.273 483)">Organizer-provided FHIR Server</text></g><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(911.023 510)">Validates token and returns resources</text></g><path d="" fill="none"/><path d="" fill="#475569"/><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(350.695 371.639)">1. Register client / request authorization</text></g><path d="" fill="none"/><path d="" fill="#475569"/><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(804.378 374.579)">2. Issue access token</text></g><path d="" fill="none"/><path d="" fill="#475569"/><path d="" fill="none"/><path d="" fill="#475569"/><rect x="245" y="660" width="810" height="125" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" fill="#F8FAFC"/><g><text fill="#1F2937" font-family="ArialMT" font-size="20" transform="translate(533.271 697)">Required Shared Services</text></g><g><text fill="#374151" font-size="18" transform="translate(298.194 739)">IPS Validation Service (Track 1 only)</text><text fill="#374151" font-size="18" transform="translate(676.944 739)">Connectathon Test Management Service</text></g><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(287.798 767)">These services support the event but are not part of the IUA authorization transaction itself.</text></g><g><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(495.418 488)">3. Protected request with access token</text></g><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(490.404 580)">4. Authorized response or access denial</text></g><g><g><g><line x1="395.2" y1="505" x2="885.2" y2="505" stroke="#475569" stroke-width="2" stroke-miterlimit="10" fill="none"/><g><path d="M882.2 515 899.5 505 882.2 495Z" fill="#475569"/></g></g></g><g><g><g><line x1="904.8" y1="553" x2="