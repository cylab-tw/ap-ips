roperability support</text></g><rect x="170" y="700" width="300" height="110" stroke="#6366F1" stroke-width="2.2" fill="#EEF2FF"/><text fill="#1F2937" font-family="ArialMT" font-size="20" transform="translate(236.491 742)">Participant Creator</text><text fill="#374151" font-family="ArialMT" font-size="18" transform="translate(181.77 773)">Generates IPS, SHC, SHL, or VHL</text><rect x="930" y="700" width="300" height="110" stroke="#6366F1" stroke-width="2.2" fill="#EEF2FF"/><text fill="#1F2937" font-family="ArialMT" font-size="20" transform="translate(983.708 742)">Participant Consumer</text><text fill="#374151" font-family="ArialMT" font-size="18" transform="translate(946.433 773)">Retrieves, validates, and displays</text><path d="" fill="none"/><path d="" fill="#475569"/><path d="" fill="none"/><path d="" fill="#475569"/><g><text fill="#4B5563" font-family="ArialMT" font-size="18" transform="translate(398.351 672)">Participants connect to the shared services required by their selected tracks</text></g><g><g><line x1="330" y1="700" x2="490.9" y2="626" stroke="#475569" stroke-width="2" stroke-miterlimit="10" fill="none"/><g><path d="M492.4 636.3 503.9 620 484 618.2Z" fill="#475569"/></g></g></g><g><g><line x1="1121" y1="699.3" x2="910.5" y2="624.8" stroke="#475569" stroke-width="2" stroke-miterlimit="10" fill="none"/><g><path d="M916.5 616.4 896.9 620 909.9 635.2Z" fill="#475569"/></g></g></g></svg>