      {
        "title": "Connectathon",
        "url": "/en/connectathon.html",
        "content": "Back to ResourcesConnectathon  IHE Connectathons provide a structured, profile-driven testing environment where participants validate interoperability using IHE profiles and HL7 international standards. Within AP-IPS, Connectathon activities focus on cross-border IPS exchange scenarios, alignment of national FHIR implementation guides, and verification of real-world interoperability between systems from different countries.  Key objectives include:          Validating standards conformance and interoperability      Identifying gaps between specifications and real-world implementation      Strengthening regional alignment with international standards      What is a Connectathon?Connectathon is a portmanteau of the words Connectivity and Marathon. It is an interoperability testing event conducted over several consecutive days (typically three to five days), during which participants meet face-to-face to test interoperability among their developed systems.Participants implement systems based on specific profiles and clinical or operational scenarios. These profiles are typically structured by decomposing requirements into actors and transactions, where communication between actors is defined using open, internationally recognized standards such as HL7, DICOM, IEEE, OSI, and other international or industry-standard specifications.Purpose of a ConnectathonThe primary objective of a Connectathon is to verify interoperability among systems developed in accordance with specified standards and profiles. Prior to the event, participants may prepare and test their systems using open-source testing tools or their own development environments. A Connectathon provides a structured and rigorous validation environment, enabling participants to collaboratively test interoperability between products. Standardized technical frameworks allow systems to be tested in a manner consistent with real-world deployment or publication conditions.Benefits of ParticipationOrganizations participating in a Connectathon can:  Validate whether their products conform to relevant standards;  Test interoperability with systems from other vendors using real-world use cases;  Rapidly identify and resolve technical integration and interface issues through close, collaborative problem-solving.During the event, participants conduct live connection tests with other systems to verify compliance with international standards. Any non-conformant issues identified can often be corrected within a short timeframe. Connectathon testing environments support the validation of tens of thousands of transactions, and results are evaluated by neutral Connectathon Monitors, who independently assess and confirm interoperability outcomes.After the ConnectathonUpon completion, results are published in a Connectathon Results Matrix, allowing stakeholders to review verified interoperability outcomes. Through Connectathon activities, industry participants foster data exchange, mutual collaboration, and cooperative development, ultimately enabling the creation of products with global market competitiveness.Achieving Healthcare IT Interoperability Through CollaborationTo promote interoperability between healthcare IT users and vendors, the following key practices are essential:  Clearly defining use cases;  Identifying the information and processes required to support those use cases;  Implementing information exchange using existing international standards;  Participating in annual Connectathons to demonstrate system conformance;  Encouraging close collaboration among care providers, IT professionals, and vendors to jointly define standards and common guidelines.In this collaborative model, care providers contribute real-world clinical challenges, IT professionals and vendors develop standards-compliant solutions to address those needs, and healthcare organizations procure systems that conform to shared guidelines and interoperability requirements."

      {

        "content": "# Asia Pacific International Patient Summary (AP IPS)### Advancing Cross-Border Healthcare Interoperability in the Asia-Pacific Region![Overview](../assets/images/overview.png)The alliance of Asia Pacific International Patient Summary (AP-IPS) is an international collaborative initiative dedicated to promoting the adoption, implementation, and testing of the Fast Healthcare Interoperability Resources (FHIR) International Patient Summary (IPS).AP-IPS brings together national IHE organizations, HL7 organizations, standards experts, healthcare institutions, and industry partners to address real-world interoperability challenges and accelerate digital health transformation.AP-IPS promotes a continuous and iterative interoperability lifecycle:## Video * Those videos were created by NotebookLM.  ###  FHIR IPS: Your Health History, Unlocked ### FHIR IPS 国際健康パスポート：ボーダレスな医療情報 (日本語)### FHIR IPS국제건강여권: 국경없는의료정보 (한국어)### FHIR IPS國際健康護照：無國界醫療數據 (繁體中文)### 你的醫療保健準備好迎接一個無國界的世界了嗎? (繁體中文) ## Standards → Implementation → Connectathon → Validation![Lifecycle](../assets/images/lifecycle.png)"

      {
        "title": "Introduction",
        "url": "/en/introduction.html",
        "content": "# IntroductionThe Asia Pacific International Patient Summary Alliance (AP-IPS) was established to support international healthcare interoperability by focusing on the International Patient Summary (IPS) as a foundational use case.## How AP-IPS WorksAP-IPS operates as a collaborative, country-driven interoperability framework that enables participating Asia-Pacific economies to jointly define, test, and validate interoperable IPS through collaborative specifications and Plugathon-based validation.![未命名](../assets/images/how-ap-ips-works.jpg)### 1. Regional Needs and Use-Case IdentificationParticipating economies—through healthcare authorities, standards organizations, academic institutions, hospitals, and industry representatives—collectively identify cross-border clinical scenarios where the IPS is required, such as emergency care, referral continuity, disaster response, and patient mobility. National inputs are consolidated to reflect regional clinical and operational needs, ensuring that IPS exchange requirements are grounded in real-world practice rather than isolated technical assumptions.### 2. Joint Specification DevelopmentBased on agreed regional use cases, AP-IPS establishes multinational specification working groups, composed of representatives from participating countries. Rather than unilateral specification development, AP-IPS emphasizes co-creation, where all participating countries contribute equally to the definition of interoperable IPS exchange specifications. These groups collaboratively define:* IPS exchange profiles and constraints* FHIR-based data elements and extensions* Terminology alignment and localization considerations* Security, transport, and governance assumptions### 3. Open Reference Implementations and ToolingTo accelerate adoption and ensure consistency, AP IPS encourages the development of open-source reference implementations, validation tools, and sample datasets that lower barriers to entry and improve implementation quality across the region. These artifacts serve as practical guidance for:* National implementers* Healthcare providers* Vendors and startups* Research and innovation communities### 4. Asia-Pacific PlugathonAP-IPS conducts an annual Asia Pacific Plugathon, modeled after IHE Connectathon principles but focused specifically on IPS exchange. Participation includes healthcare institutions, system vendors, startups, and national initiatives, fostering a neutral, vendor-independent testing environment. During the Plugathon:* Implementers test system-to-system IPS exchanges based on AP-IPS specifications;* Cross-country interoperability is validated in realistic scenarios;* Technical and semantic issues are identified collaboratively.### 5. Alignment with International StandardsResults from Plugathon testing and pilot deployments are systematically reviewed by AP-IPS working groups. This establishes a continuous improvement loop, ensuring that AP-IPS specifications remain clinically relevant, technically sound, and internationally aligned. AP-IPS does not replace global standards. Instead, it acts as a regional convergence platform, consolidating Asia-Pacific implementation experience and feeding it back into * HL7 IPS Working Groups,* IHE international domain committees, and* Other relevant international standardization activities.          Asia Pacific Green Button  "

        "title": "Plugathon",
        "url": "/en/plugathon.html",
        "content": "[Back to Resources](../en/resources)---## PlugathonPlugathons emphasize rapid, developer-oriented testing and prototyping based on international standards, e.g., HL7, DICOM, and FHIR. These events lower the barrier to participation and foster hands-on collaboration among engineers, architects, and domain experts.### Profile #1: Sharing of FHIR International Patient Demographics#### Description* This profile focuses on establishing cross-institutional and cross-border patient identity consistency through a Master Patient Index (MPI) mechanism. The Patient Master Identity Registry (PMIR) Profile enables different systems to share, synchronize, and update patient demographic data (e.g., name, date of birth, identifiers), ensuring that the same individual can be accurately identified across international healthcare domains.#### Goal* To realize cross-border patient identity federation, providing the foundational layer for international health data exchange.#### Scenarios* Synchronizing patient demographic updates among multiple FHIR servers in different countries.* Resolving patient identity conflicts and maintaining consistency via PMIR subscription/notification.* Demonstrating cross-system queries of patient demographics through FHIR-based APIs.#### Future Outlook* The PMIR-based patient identity framework will evolve toward cross-border integration with the Master Patient Index (MPI), enabling international patient linking and deduplication.* Future work may include identity federation between national healthcare systems and trusted patient matching algorithms leveraging AI/ML techniques.* Integration with FHIR Consent and Privacy Policies to govern data access across regions.![12](../assets/images/track1-demographics.jpg)### Profile #2: Sharing of FHIR International Patient Summary#### Description* This profile supports cross-system exchange of patient summaries based on FHIR International Patient Summary (IPS) specifications.* The goal is to enable secure sharing of key health information—such as allergies, medications, conditions, procedures, and immunizations—across countries and healthcare organizations.#### Goal* To establish a standardized framework for cross-border exchange of health summaries, facilitating continuity of care for international and mobile patients.#### Scenarios* **Scenario #1 – Basic Sharing (Minimal IPS)**  - **Purpose**:** Validate creation and sharing of the minimal IPS composition with all required resources.  - **Content:**      - Composition (IPS profile) with required metadata.      - Patient (IPS patient profile).      - At least 1 Problem, 1 Allergy, and Medical Summary section.  - **Test Flow:**      - Creator creates IPS with minimal content.      - Consumer queries/retrieves the IPS via FHIR API (DocumentReference/Composition).* **Scenario #2 – Advanced Sharing (Expanded IPS)**  - **Purpose**:** Validate creation and sharing of the Expanded IPS composition with optional required resources.  - **Content:**     - #2-1 Laboratory Report         - Add DiagnosticReport (Laboratory profile) with referenced Observations.         - Include LOINC-coded lab results in IPS Results section.     - #2-2 Pathology Report         - Add DiagnosticReport (Pathology profile) with Observation and possible image references (DocumentReference).     - #2-3 Radiology Report with Image (IPS + WIA)         - Add DiagnosticReport (Radiology profile) with ImagingStudy and image references (e.g., DICOMweb URL in Media).  - **Test Flow:**     - Creator creates an expanded IPS with one or more of the above reports.     - Consumer retrieves and verifies completeness of references.     - Verify that referenced resources are resolvable and conform to profiles.* **Scenario #3 – Retrieval and Display IPS**  - **Purpose**:**      - [Required]: Validate correct rendering of IPS in a clinical viewer.      - [Optional]: Test mapping of coded values between code systems using the IHE SVCM profile to ensure terminology interoperability,.  - **Content:** Any IPS from Scenario #1 or #2.  - **Test Flow:**      - Query IPS: Recipient queries IPS via FHIR API.      - Retrieve IPS Bundle: retrieve IPS Bundle (Composition + referenced resources).      - Render in a human-readable view: preserving section structure and narrative text.      - SVCM Mapping [Option]:          - Identify coded elements in the IPS (e.g., LOINC, SNOMED CT, ICD‑10).          - Display mapped terms alongside original codes in the viewer.          - Query an SVCM server for a ConceptMap to map codes to a alternative code system. e.g, Japan, Korea, or Taiwan code systems.#### Actors &Transactions Diagram* Exchange IPS via FHIR RESTful API![圖片](../assets/images/track2-fhir-api.png)* IPS with Imaging Report via FHIR and DICOMweb API![圖片](../assets/images/track2-imaging.png)* IHE SVCM (Sharing Valuesets, Codes, and Maps)![圖片](../assets/images/track2-svcm.png)#### Future Outlook* Expansion from IPS to comprehensive health records and domain-specific summaries, e.g., oncology, immunization, and maternal health.* Adoption of FHIR-based translation and terminology mapping services (SVCM) to ensure multilingual and semantic interoperability across borders.![未命名](../assets/images/track2-overview.jpg)### Profile #3: Sharing of FHIR IPS with Digtial Health Wallet #### DescriptionThis profile focuses on enabling patient-mediated exchange of FHIR IPS integrating with digital signature, verifiable credentials, and digital health wallet technologies. In this profile, the FHIR IPS is packaged as a cryptographically verifiable and portable credential, allowing patients to securely carry, present, and share their health summaries across borders. This approach leverages emerging international initiatives and national digital identity infrastructures, such as:* WHO Smart Health Cards (SHC)* Japan My Number Card* Taiwan Digital Identity Wallet* Other national or regional digital wallet platformsFHIR IPS data is exchanged using QR codes or secure digital channels, with access strictly controlled by explicit patient consent. Advanced credential technologies such as Selective Disclosure JWT (SD-JWT) are used to ensure privacy-preserving data sharing.#### GoalThe primary goals of this profile are to:* Enable portable, patient-controlled FHIR IPS facilitating cross-border, emergency, and ad-hoc healthcare scenarios* Align FHIR IPS with global digital identity and verifiable credential ecosystems to ensure data authenticity, integrity, and trust through digital signatures and certificates* Support selective disclosure, allowing patients to share only the necessary portions of their IPSUltimately, this profile aims to shift IPS exchange from system-to-system only models toward a patient-centric interoperability paradigm.#### ScenariosTypical scenarios addressed in this profile include:1. **Cross-border Travel and Emergency Care**A patient traveling abroad presents a QR code from their digital health wallet.The receiving healthcare provider verifies the IPS credential, validates the digital signature, and retrieves the IPS after patient consent.2. **Patient-Controlled Selective Sharing**Using SD-JWT, a patient selectively discloses specific IPS sections (e.g., allergies, medications) while withholding other sensitive information.3. **Outpatient or Referral Visits**Patients share their IPS during first-time visits without requiring prior system integration between institutions.4. **Public Health or Disaster Response**Rapid access to trusted patient summaries using offline-capable QR codes and verifiable credentials.5. **Integration with National Digital Identity Systems**Binding IPS credentials to national identity wallets (e.g., My Number, Taiwan Digital ID) to establish trusted identity assurance.#### Future OutlookThis profile represents a critical step toward the future of trusted, decentralized, and patient-driven health data exchange. Future directions include:* Deeper alignment with W3C Verifiable Credentials (VC) standards* Broader adoption of SD-JWT and privacy-enhancing technologies* Interoperability testing between health wallets, identity wallets, and healthcare systems* Harmonization with AP IPS governance models and international regulatory frameworks* Expansion to support additional FHIR-based artifacts beyond IPS (e.g., immunization records, imaging summaries)* By combining FHIR IPS, digital identity, and cryptographic trust mechanisms, this profile lays the foundation for a scalable and globally interoperable personal health record ecosystem.![未命名](../assets/images/track3-wallet.jpg)"

        "content": "# Connectathon ThemesThis page describes the Connectathon Profiles as IHE-style technical specifications. Each Profile is structured as a comprehensive specification, including Actors, Transactions, Options, Security Considerations, and Cross-Profile Relationships.## Available Profiles### [Profile #1: FHIR International Patient Demographics Profile (IPD)](/en/track-1-ipd)Establishes cross-institutional and cross-border patient identity consistency via Master Patient Index (MPI) mechanisms. Enables different systems to share, synchronize, and update patient demographic data for accurate identification across international healthcare domains.---### [Profile #2: FHIR International Patient Summary Exchange Profile (IPSE)](/en/track-2-ipse)Supports cross-system exchange of patient summaries based on HL7 FHIR IPS Implementation Guide and IHE Mobile access to Health Documents (MHD) Profile. Enables secure sharing of key health information (allergies, medications, conditions, procedures, immunizations) across countries and healthcare organizations.---### [Profile #3: IPS Digital Health Wallet Profile (IPS-DHW)](/en/track-3-ips-dhw)Enables patient-mediated exchange of FHIR IPS integrated with digital signatures, verifiable credentials, and digital health wallet technologies. FHIR IPS documents are packaged as cryptographically verifiable portable credentials using QR codes, W3C Verifiable Credentials, and Selective Disclosure JWT (SD-JWT), supporting privacy-preserving and patient-controlled data sharing across borders.---## Technical DocumentationEach Profile has complete IHE Technical Framework-style specification documentation including:- Actor Definitions and Transaction Requirements (with Optionality)- Actor Options and Required Groupings- Detailed Use Cases and Process Flows- Security and Privacy Considerations- Cross-Profile Relationships and Dependencies- Implementation GuidanceFor detailed profile specifications, architecture diagrams, and conformance requirements, please visit the individual Profile documentation pages (links above)."

      {
        "title": "Profile",
        "url": "/en/track-1-ipd.html",
        "content": "# Profile #1: FHIR International Patient Demographics Profile (IPD)This profile establishes cross-institutional and cross-border patient identity consistency through a Master Patient Index (MPI) mechanism, based on the IHE Patient Master Identity Registry (PMIR) Profile. It enables different systems to share, synchronize, and update patient demographic data (e.g., name, date of birth, identifiers), ensuring that individuals can be accurately identified across international healthcare domains.## 1.1 IPD Actors, Transactions, and Content ModulesThis section defines the actors and transactions in the IPD Profile. To claim compliance with this profile, an actor shall support all required transactions (labeled \"R\") and may support the optional transactions (labeled \"O\").**Table 1.1-1: IPD Profile – Actors and Transactions**| Actor | Transaction | Optionality | Reference ||---|---|---|---|| Patient Identity Source | Mobile Patient Identity Feed [ITI-93] | R | IHE PMIR ITI TF-2: 3.93 || Patient Identity Manager | Mobile Patient Identity Feed [ITI-93] | R | IHE PMIR ITI TF-2: 3.93 ||  | Mobile Patient Identity Query [ITI-78] | R | IHE PDQm ITI TF-2: 3.78 ||  | Subscribe to Patient Updates [ITI-94] | O | IHE PMIR ITI TF-2: 3.94 || Patient Identity Consumer | Mobile Patient Identity Query [ITI-78] | R | IHE PDQm ITI TF-2: 3.78 ||  | Subscribe to Patient Updates [ITI-94] | O | IHE PMIR ITI TF-2: 3.94 |### 1.1.1 Actor Descriptions and Actor Profile Requirements#### 1.1.1.1 Patient Identity SourceThe Patient Identity Source supplies patient demographic data to the Patient Identity Manager. It initiates the Mobile Patient Identity Feed [ITI-93] transaction to create, update, merge, or delete patient identity records across cross-border healthcare domains.#### 1.1.1.2 Patient Identity ManagerThe Patient Identity Manager maintains the authoritative patient identity registry (MPI). It receives identity feeds from Patient Identity Sources, responds to demographic queries from Patient Identity Consumers, and manages subscription-based update notifications. The Patient Identity Manager shall resolve identity conflicts and maintain consistency across federated systems.#### 1.1.1.3 Patient Identity ConsumerThe Patient Identity Consumer queries the Patient Identity Manager to resolve patient identities based on partial demographic data. It may subscribe to receive real-time notifications when tracked patient identity records change.## 1.2 IPD Actor OptionsOptions that may be selected for each actor are listed in Table 1.2-1.**Table 1.2-1: IPD – Actors and Options**| Actor | Option | Reference ||---|---|---|| Patient Identity Manager | Subscription Notification Option | Section 1.2.1 || Patient Identity Consumer | Subscription Notification Option | Section 1.2.1 |### 1.2.1 Subscription Notification OptionActors that support this option use the Subscribe to Patient Updates [ITI-94] transaction to receive real-time notifications when patient identity records are created, updated, or merged. This option is required for actors that need to maintain synchronized patient identity caches across borders.## 1.3 IPD Required Actor GroupingsAn actor from this profile shall implement required transactions in addition to all transactions required for the grouped actor.**Table 1.3-1: Required Actor Groupings**| IPD Actor | Actor to be grouped with | Reference ||---|---|---|| Patient Identity Source | CT / Time Client | ITI TF-1: Consistent Time || Patient Identity Manager | CT / Time Client | ITI TF-1: Consistent Time || Patient Identity Manager | ATNA / Secure Node | ITI TF-1: ATNA || Patient Identity Consumer | IUA / Authorization Client | ITI TF-1: IUA |## 1.4 IPD Overview### 1.4.1 ConceptsThe IPD Profile enables cross-border patient identity federation by establishing a common mechanism to share, synchronize, and update patient demographic data across different healthcare domains using FHIR-based APIs.Key concepts:- **Patient Identity**: A set of demographic attributes (e.g., name, date of birth, national identifier) used to uniquely identify an individual across systems.- **Identity Federation**: The ability to correlate patient identities across different organizations and national healthcare systems.- **MPI (Master Patient Index)**: A centralized or federated registry that maintains authoritative patient identity records and supports cross-system linking and deduplication.- **Golden Record**: The authoritative, merged patient identity record maintained by the Patient Identity Manager.### 1.4.2 Use Cases**Use Case 1 – Cross-Border Identity Synchronization**A patient's demographic data is updated in their home country's system. The update is propagated to partner country systems via the Mobile Patient Identity Feed [ITI-93] transaction to the Patient Identity Manager.**Use Case 2 – Patient Identity Query**A healthcare provider in a foreign country queries the Patient Identity Manager using partial demographic data (e.g., name and birthdate) to resolve the patient's cross-border identity via the Mobile Patient Identity Query [ITI-78] transaction.**Use Case 3 – Identity Conflict Resolution**When conflicting demographics exist across systems (e.g., duplicate records from different countries), the Patient Identity Manager merges records into a golden record and notifies subscribed consumers via Subscribe to Patient Updates [ITI-94].### 1.4.3 Process FlowThe following diagram illustrates the basic process flow for patient identity federation:1. The Patient Identity Source submits or updates patient demographic data to the Patient Identity Manager via Mobile Patient Identity Feed [ITI-93].2. The Patient Identity Consumer queries for patient identity via Mobile Patient Identity Query [ITI-78].3. If subscribed (Subscription Notification Option), the Patient Identity Consumer receives update notifications via Subscribe to Patient Updates [ITI-94].## 1.5 IPD Security ConsiderationsAll transactions shall be secured using TLS compliant with BCP195. Patient demographic data is considered personally identifiable information (PII) and shall be protected in accordance with applicable national privacy regulations. Access control shall be enforced at the Patient Identity Manager. The Patient Identity Manager shall audit all identity feed and query transactions in accordance with IHE ATNA requirements.## 1.6 IPD Cross Profile ConsiderationsThe IPD Profile provides the foundational patient identity layer for the IPSE Profile (Profile #2). Patient identity resolution via IPD must be established before IPS documents can be securely exchanged across borders. Future integration with FHIR Consent resources will enable privacy-policy-governed identity federation.![Profile 1 Demographics](../assets/images/track1-demographics.jpg)---[← Back to Themes](/en/themes)"

        "title": "Profile",
        "url": "/en/track-2-ipse.html",
        "content": "# Profile #2: FHIR International Patient Summary Exchange Profile (IPSE)This profile supports cross-system exchange of patient summaries based on the HL7 FHIR International Patient Summary (IPS) Implementation Guide and IHE Mobile access to Health Documents (MHD) Profile. It enables secure sharing of key health information—such as allergies, medications, conditions, procedures, and immunizations—across countries and healthcare organizations.## 2.1 IPSE Actors, Transactions, and Content ModulesThis section defines the actors and transactions of the IPSE Profile. The IPSE Profile supports two complementary methods for IPS exchange: **IHE Transactions** (MHD-based) and **FHIR API** (RESTful). To claim compliance with this profile, an actor shall support transactions according to the selected binding method (see Section 2.2.6 – API Binding Option).### Approach 1: IHE MHD Transactions**Table 2.1-1: IPSE Profile – Actors and Transactions (IHE MHD Approach)**| Actor | Transaction | Optionality | Reference ||---|---|---|---|| IPS Creator | Provide IPS Document Bundle [ITI-65] | R | IHE MHD ITI TF-2: 3.65 || IPS Repository | Provide IPS Document Bundle [ITI-65] | R | IHE MHD ITI TF-2: 3.65 ||  | Find IPS Document References [ITI-67] | R | IHE MHD ITI TF-2: 3.67 ||  | Retrieve IPS Document [ITI-68] | R | IHE MHD ITI TF-2: 3.68 || IPS Consumer | Find IPS Document References [ITI-67] | R | IHE MHD ITI TF-2: 3.67 ||  | Retrieve IPS Document [ITI-68] | R | IHE MHD ITI TF-2: 3.68 || Terminology Server | Concept Map Translate [ITI-SVCM] | O | IHE SVCM |### Approach 2: FHIR RESTful API**Table 2.1-2: IPSE Profile – Actors and Transactions (FHIR API Approach)**| Actor | Operation / Interaction | Optionality | Reference ||---|---|---|---|| IPS Creator | Create IPS Bundle (POST /Bundle) | R | FHIR Document Resource ||  | Update IPS Composition (PUT /Composition/{id}) | O | FHIR Composition Resource || IPS Repository | Create/Store IPS Bundle (POST /Bundle) | R | FHIR Document Resource ||  | Search DocumentReference (_search via GET) | R | FHIR DocumentReference Search ||  | Retrieve IPS Bundle (GET /Bundle/{id}) | R | FHIR Bundle Resource ||  | Update IPS Metadata (PUT /DocumentReference/{id}) | O | FHIR DocumentReference Resource || IPS Consumer | Search Document References (GET /DocumentReference?_search) | R | FHIR search ||  | Retrieve IPS Bundle (GET /Bundle/{id}) | R | FHIR Bundle Resource ||  | Read Composition (GET /Composition/{id}) | R | FHIR Composition Resource || Terminology Server | Concept Map Translate (POST /ConceptMap/$translate) | O | FHIR ConceptMap Operation |### 2.1.1 Actor Descriptions and Actor Profile Requirements#### 2.1.1.1 IPS CreatorThe IPS Creator creates FHIR IPS documents conforming to the HL7 FHIR IPS Implementation Guide and submits them to the IPS Repository via Provide IPS Document Bundle [ITI-65]. The IPS Creator shall generate a valid FHIR Bundle of type `document` containing:- A `Composition` resource conforming to the IPS Composition profile, with required metadata.- A `Patient` resource conforming to the IPS Patient profile.- Required clinical sections: Medication Summary, Allergies and Intolerances, and Problem List.The IPS Creator shall support the Minimal IPS content set and may support optional report types via actor options (see Section 2.2).#### 2.1.1.2 IPS RepositoryThe IPS Repository stores IPS documents and provides access to IPS Consumers. It accepts submissions from IPS Creators, responds to document reference queries, and serves document retrieval requests. The IPS Repository shall:- Maintain FHIR `DocumentReference` metadata for each stored IPS.- Support FHIR search parameters as defined in the IPS Implementation Guide and IHE MHD.- Return the complete IPS Bundle upon retrieval, including all referenced resources.#### 2.1.1.3 IPS ConsumerThe IPS Consumer queries and retrieves IPS documents from the IPS Repository. It processes the IPS Bundle to present clinical content to healthcare providers. The IPS Consumer shall:- Query for IPS document references via Find IPS Document References [ITI-67].- Retrieve the full IPS Bundle via Retrieve IPS Document [ITI-68].- Parse and handle all required IPS sections.- Support the Rendering Option (see Section 2.2.5) to present IPS in a human-readable clinical viewer.#### 2.1.1.4 Terminology Server (Optional)The Terminology Server provides terminology mapping services under the IHE Sharing Valuesets, Codes, and Maps (SVCM) Profile. It enables translation of coded IPS values between different national code systems (e.g., LOINC, SNOMED CT, ICD-10, and national systems for Japan, Korea, and Taiwan) using FHIR ConceptMap resources.## 2.2 IPSE Actor OptionsOptions that may be selected for each actor are listed in Table 2.2-1. Note that the API Binding Option (Section 2.2.6) is a fundamental transport binding and may be combined with content options.**Table 2.2-1: IPSE – Actors and Options**| Actor | Option | Reference ||---|---|---|| IPS Creator | Laboratory Report Option | Section 2.2.1 ||  | Pathology Report Option | Section 2.2.2 ||  | Radiology Report with Imaging Option | Section 2.2.3 ||  | API Binding Option (FHIR RESTful) | Section 2.2.6 || IPS Repository | API Binding Option (FHIR RESTful) | Section 2.2.6 || IPS Consumer | Terminology Mapping Option (SVCM) | Section 2.2.4 ||  | Rendering Option | Section 2.2.5 ||  | API Binding Option (FHIR RESTful) | Section 2.2.6 |### 2.2.1 Laboratory Report OptionIPS Creators that support this option shall include `DiagnosticReport` resources conforming to the Laboratory Report profile, with referenced `Observation` resources and LOINC-coded results in the IPS Results section. IPS Consumers that support this option shall parse and display laboratory diagnostic reports.### 2.2.2 Pathology Report OptionIPS Creators that support this option shall include `DiagnosticReport` resources conforming to the Pathology Report profile, with `Observation` resources and optional image references via `DocumentReference`. IPS Consumers that support this option shall parse and display pathology diagnostic reports.### 2.2.3 Radiology Report with Imaging OptionIPS Creators that support this option shall include `DiagnosticReport` resources conforming to the Radiology Report profile, with `ImagingStudy` resources and image references using DICOMweb URLs (e.g., in `Media` or `ImagingStudy.series.instance`). IPS Consumers that support this option shall parse imaging reports and resolve DICOMweb image references.### 2.2.4 Terminology Mapping Option (SVCM)IPS Consumers that support this option shall use the IHE SVCM ConceptMap Translate transaction to map coded IPS values between code systems. The IPS Consumer shall query the Terminology Server to resolve local equivalents for LOINC, SNOMED CT, and ICD-10 codes, and display mapped terms alongside original codes in the clinical viewer.### 2.2.5 Rendering OptionIPS Consumers that support this option shall render the IPS in a human-readable clinical viewer, preserving section structure, coded displays, and FHIR Narrative (`text`) content. The rendering shall be suitable for presentation to a healthcare professional without additional processing.### 2.2.6 API Binding Option (FHIR RESTful)Actors that support this option implement FHIR RESTful API bindings (Table 2.1-2) instead of IHE MHD transactions (ITI-65/67/68). The API Binding Option enables standards-based IPS exchange using FHIR operations and search interactions over HTTP(S):- **IPS Creator / Repository**: Implement HTTP POST to create/store IPS Bundles and HTTP PUT for updates.- **IPS Repository**: Execute FHIR searches with standard query parameters to enable document discovery without requiring Transaction [ITI-67].- **IPS Consumer**: Use HTTP GET to retrieve IPS Bundles and perform FHIR searches to locate document references.- **Terminology Server**: Implement FHIR ConceptMap $translate operation for code mapping queries.Actors adopting this option shall maintain compliance with FHIR resource profiles and support secure HTTP(S) communications with authentication via OAuth 2.0 or mutual TLS.## 2.3 IPSE Required Actor GroupingsAn actor from this profile shall implement required transactions in addition to all transactions required for the grouped actor.**Table 2.3-1: IPSE Required Actor Groupings**| IPSE Actor | Actor to be grouped with | Reference ||---|---|---|| IPS Creator | CT / Time Client | ITI TF-1: Consistent Time || IPS Repository | CT / Time Client | ITI TF-1: Consistent Time || IPS Repository | ATNA / Secure Node | ITI TF-1: ATNA || IPS Consumer | IUA / Authorization Client | ITI TF-1: IUA |## 2.4 IPSE Overview### 2.4.1 ConceptsThe IPSE Profile establishes a standardized framework for cross-border exchange of health summaries. The IPS document uses the FHIR `Bundle` of type `document` to represent a patient's key health information in a structured, interoperable format. The profile supports both minimal and expanded IPS content sets.Key concepts:- **IPS Composition**: The `Composition` resource that defines the structure and sections of an IPS document, including required and optional clinical sections.- **IPS Bundle**: A self-contained FHIR `Bundle` of type `document` containing the `Composition` and all referenced clinical resources.- **Minimal IPS**: An IPS containing all required sections: Medication Summary, Allergies and Intolerances, and Problem List.- **Expanded IPS**: A Minimal IPS extended with optional sections such as Laboratory Results, Pathology Reports, and Radiology Reports.### 2.4.2 Use Cases**Use Case 1 – Basic IPS Sharing (Minimal IPS)**Purpose: Validate creation and retrieval of the minimal IPS document with all required sections.Process Flow:1. IPS Creator constructs a Minimal IPS Bundle conforming to the HL7 FHIR IPS Implementation Guide.Method A (IHE MHD Transactions):2. IPS Creator submits the IPS via Provide IPS Document Bundle [ITI-65] to the IPS Repository.3. IPS Consumer queries for document references via Find IPS Document References [ITI-67].4. IPS Consumer retrieves the full IPS Bundle via Retrieve IPS Document [ITI-68].Method B (FHIR RESTful API):2. IPS Creator submits the IPS Bundle to the Repository via FHIR API (for example `POST /Bundle`).3. IPS Consumer queries IPS document metadata via FHIR search (for example `GET /DocumentReference?patient={id}`).4. IPS Consumer retrieves the full IPS Bundle via FHIR API (for example `GET /Bundle/{id}`).5. IPS Consumer validates that all required sections and referenced resources are present and conformant.**Use Case 2 – Advanced IPS Sharing (Expanded IPS)**Purpose: Validate creation and retrieval of an expanded IPS with optional diagnostic report types.Sub-scenarios:- **#2-1 Laboratory Report**: IPS Creator (with Laboratory Report Option) includes `DiagnosticReport` with LOINC-coded `Observation` resources.- **#2-2 Pathology Report**: IPS Creator (with Pathology Report Option) includes `DiagnosticReport` with `Observation` and optional image `DocumentReference`.- **#2-3 Radiology Report with Imaging**: IPS Creator (with Radiology Report with Imaging Option) includes `DiagnosticReport` with `ImagingStudy` and DICOMweb image references.Process Flow:1. IPS Creator constructs an Expanded IPS Bundle with one or more optional report types.2. IPS Creator submits the IPS via Provide IPS Document Bundle [ITI-65].3. IPS Consumer retrieves the IPS and verifies completeness of all referenced resources.4. IPS Consumer verifies that referenced resources are resolvable and conform to the relevant profiles.**Use Case 3 – IPS Retrieval and Rendering**Purpose: Validate correct rendering of an IPS in a clinical viewer, with optional SVCM terminology mapping.Process Flow:1. IPS Consumer queries IPS Repository via Find IPS Document References [ITI-67].2. IPS Consumer retrieves the IPS Bundle via Retrieve IPS Document [ITI-68].3. IPS Consumer (with Rendering Option) renders the IPS in a human-readable clinical viewer, preserving section structure and narrative text.4. (Optional – Terminology Mapping Option) IPS Consumer identifies coded elements in the IPS (e.g., LOINC, SNOMED CT, ICD-10) and queries the Terminology Server for a ConceptMap to map codes to a local code system (e.g., Japanese, Korean, or Taiwanese code systems). Mapped terms are displayed alongside the original codes.Implementation Note:- After retrieving the document from the Repository, the Document Consumer shall parse the FHIR Bundle content.- Consumer implementation may include a FHIR Server component for structured processing and persistence of resources.- Consumer implementation may also directly parse and present the Bundle in a clinical UI, for example by using an IPS Viewer.### 2.4.3 Process Flow Diagrams#### Method 1: Exchange of IPS via IHE Transactions (MHD)**Actor Interaction Diagram – IHE MHD Transactions**![Exchange of IPS via IHE transactions](../assets/images/track2-ihe-transactions.png)**Process Description (IHE MHD):**1. IPS Creator submits IPS Bundle to Repository via Provide IPS Document Bundle [ITI-65].2. IPS Consumer queries for document references via Find IPS Document References [ITI-67].3. IPS Consumer retrieves the full IPS Bundle via Retrieve IPS Document [ITI-68].4. For terminology mapping, IPS Consumer queries Terminology Server via SVCM Concept Map Translate [ITI-SVCM].**Implementation Note (Document Consumer):**- When a Document Consumer retrieves a document from the Repository, the consumer shall parse the FHIR Bundle content locally.- Consumer implementations may include a FHIR Server component for structured resource processing and persistence.- Consumer implementations may also parse and render the retrieved Bundle directly for clinical display, for example by using an IPS Viewer.**Exchange of IPS with Imaging Report via IHE Transactions and DICOMweb API**![Exchange of IPS with Imaging Report via IHE transactions and DICOMweb API](../assets/images/track2-ihe-imaging.png)#### Method 2: Exchange of IPS via FHIR RESTful API**Actor Interaction Diagram – FHIR API**![Exchange of IPS via FHIR API](../assets/images/track2-fhir-api.png)**Process Description (FHIR API):**1. IPS Creator uploads IPS Bundle to Repository via HTTP POST to `/Bundle` endpoint.2. IPS Repository stores the Bundle and generates/updates a DocumentReference resource.3. IPS Consumer retrieves document references via FHIR search: `GET /DocumentReference?patient={id}` (with optional filters).4. IPS Consumer fetches the IPS Bundle via HTTP GET to `/Bundle/{id}` endpoint.5. For terminology mapping, IPS Consumer queries Terminology Server via `POST /ConceptMap/$translate` operation.**Implementation Note (Method B):**- A Document Repository (implemented as a FHIR Server) may use the FHIR `$summary` parameter to generate a lightweight IPS FHIR document view when returning resources to a Document Consumer.- The Document Consumer may then retrieve the full IPS content as needed using standard FHIR read/search operations.**Exchange of IPS with Imaging Report via FHIR and DICOMweb APIs**![Exchange of IPS with Imaging Report via FHIR and DICOMweb APIs](../assets/images/track2-fhir-imaging.png)**API Authentication Flow:**- Both methods support OAuth 2.0 Bearer token authorization via Authorization Client (grouped with IUA Profile, Profile #1).- API requests must include `Authorization: Bearer {access_token}` header as specified in [ITI-71].#### Terminology Service Integration**IHE SVCM – Sharing Valuesets, Codes, and Maps**![IHE SVCM Terminology Mapping](../assets/images/track2-svcm.png)**Terminology Translation Methods:**- **IHE MHD Approach**: Consumer invokes SVCM Concept Map Translate [ITI-SVCM] transaction on Terminology Server.- **FHIR API Approach**: Consumer invokes FHIR ConceptMap/$translate operation via HTTP POST to `{TerminologyServerURL}/ConceptMap/$translate`.## 2.5 IPSE Security ConsiderationsAll transactions shall be secured using TLS compliant with BCP195. IPS documents contain sensitive clinical information classified as protected health information (PHI); access control shall be enforced at the IPS Repository. The IPS Repository shall audit all document submission and retrieval transactions in accordance with IHE ATNA requirements.### 2.5.1 IHE MHD Transaction SecurityWhen using the **IHE Transactions** approach (Table 2.1-1):- All MHD transactions [ITI-65/67/68] shall use secure SOAP or HTTP(S) bindings.- IPS Consumers shall be grouped with the **IUA Authorization Client** to obtain access tokens via Get Access Token [ITI-71] before issuing transaction requests.- Access tokens shall be transmitted in accordance with IHE IUA profile specifications.### 2.5.2 FHIR API Security and AuthorizationWhen using the **FHIR RESTful API** approach (Table 2.1-2), actors shall implement one of the following authentication and authorization mechanisms:#### Option A: SMART on FHIR Authorization & AuthenticationActors adopting the FHIR RESTful API binding may implement **SMART on FHIR** (Substitutable Medical Applications and Reusable Technologies) authorization framework. The SMART on FHIR specification defines OAuth 2.0-based authorization with FHIR-specific conventions:**Key Components:**1. **OAuth 2.0 Authorization Flow**:\t- IPS Consumer (acting as OAuth 2.0 Client) initiates authorization via the authorization server using standard OAuth 2.0 Authorization Code flow.\t- Authorization Server redirects user to authenticate and grant consent.\t- Authorization Server issues an authorization code back to IPS Consumer.\t- IPS Consumer exchanges the authorization code for an access token via the Token Endpoint.2. **SMART on FHIR Scopes**:\t- Scopes define the resources and operations permitted. Common FHIR scopes include:\t  - `fhirUser` – Identify the current user\t  - `launch` – Used in EHR launch context\t  - `patient/Bundle.read` – Permission to read Bundle resources for the patient in context\t  - `patient/DocumentReference.read` – Permission to read DocumentReference resources\t  - `patient/Composition.read` – Permission to read Composition resources\t  - `user/IPS.read` – User-level read access to IPS documents\t- Scopes are transmitted in the authorization request: `GET {authorizationServer}/authorize?scope=patient%2FBundle.read+patient%2FDocumentReference.read&...`3. **HTTP Authorization Header**:\t- Access tokens are transmitted using the standard OAuth 2.0 Bearer token delivery mechanism in HTTP requests:\t```\tGET /Bundle/{id} HTTP/1.1\tAuthorization: Bearer {access_token}\tAccept: application/fhir+json\t```4. **SMART on FHIR Metadata Endpoint**:\t- IPS Repository shall publish FHIR capability statement at `GET /.well-known/smart-configuration` (or via `GET /metadata`) declaring:\t  - Supported authorization grant types (e.g., `authorization_code`)\t  - Authorization endpoint URL\t  - Token endpoint URL\t  - Supported FHIR scopes\t  - Supported token response types (e.g., `Bearer`)\t- Example:\t```json\t{\t  \"authorization_endpoint\": \"{RepositoryURL}/auth/authorize\",\t  \"token_endpoint\": \"{RepositoryURL}/auth/token\",\t  \"scopes_supported\": [\"fhirUser\", \"patient/Bundle.read\", \"patient/DocumentReference.read\"],\t  \"grant_types_supported\": [\"authorization_code\", \"refresh_token\"]\t}\t```    5. **Token Lifetime & Refresh**:\t- Access tokens shall include an expiration time (`exp` claim in JWT format).\t- IPS Consumers shall handle token refresh by using refresh tokens (if provided) to obtain new access tokens before expiration.\t- Authorization Server shall implement token introspection endpoint (`POST /.well-known/token-introspection`) for clients to verify token validity.**Authentication Method**: SMART on FHIR typically uses OpenID Connect (OIDC) on top of OAuth 2.0 for user authentication, with the ID token containing user identity claims.#### Option B: IHE IUA Authorization & AuthenticationAlternatively, actors may implement the **IHE IUA Profile** (User Authentication) authorization framework consistent with the IHE transaction method:- IPS Consumers shall obtain OAuth 2.0 access tokens via **Get Access Token [ITI-71]** transaction from an IUA Authorization Server.- Token requests shall include client credentials (client_id, client_secret) and the requested scope.- Authorization Server issues JWT-based access tokens conforming to IUA specifications.- Tokens are attached to subsequent FHIR API requests using the `Authorization: Bearer {token}` header.- IUA supports both **interactive user authentication** (for end-user login) and **client credential flow** (for system-to-system integration).- All IUA token exchanges shall occur over secure HTTPS (TLS 1.2 or higher).**Comparison:**| Aspect | SMART on FHIR | IHE IUA ||---|---|---|| **Foundation** | OAuth 2.0 + OpenID Connect | OAuth 2.0 || **Primary Use** | App-to-FHIR server authorization | Healthcare IT system interoperability || **Metadata Discovery** | `/.well-known/smart-configuration` | OAuth 2.0 metadata endpoint || **Scope Format** | FHIR resource-based (e.g., `patient/Bundle.read`) | Healthcare-centric (e.g., `document-retrieve`) || **User Context** | EHR Launch context, OpenID Connect ID token | IUA user identity claims || **Deployment** | Common in consumer health apps, EHR integrations | Established in enterprise healthcare networks |### 2.5.3 General Security Requirements- All HTTP(S) communications shall use TLS 1.2 or higher (BCP195 compliant).- Certificate validation shall be enforced; self-signed certificates are not recommended for production deployments.- Access tokens `exp` claim (expiration) shall be respected; expired tokens must be rejected.- IPS Repository shall implement rate limiting and request throttling to prevent abuse.- Query parameters and request bodies containing PHI shall not be logged; only request metadata (timestamp, status code) shall be retained per HIPAA Audit & Accountability requirements.- Mutual TLS (mTLS) may be used as an alternative to Bearer token authentication for system-to-system connections if supported by both parties.## 2.6 IPSE Cross Profile ConsiderationsThe IPSE Profile depends on the IPD Profile (Profile #1) for cross-border patient identity resolution prior to IPS exchange. The IPSE Profile may be extended by the IPS-DHW Profile (Profile #3) to support patient-mediated, verifiable-credential-based IPS sharing. Future expansion of the IPSE Profile includes domain-specific IPS variants (e.g., oncology summaries, immunization records, maternal health summaries) and multilingual support via SVCM.![IPS Exchange Overview](../assets/images/track2-overview.jpg)---[← Back to Themes](/en/themes)"

        "url": "/en/track-3-ips-dhw.html",
        "content": "# Profile #3: IPS Digital Health Wallet Profile (IPS-DHW)This profile enables patient-mediated exchange of FHIR IPS integrated with digital signatures, verifiable credentials, and digital health wallet technologies. The FHIR IPS document is packaged as a cryptographically verifiable and portable credential, allowing patients to securely carry, present, and share their health summaries across borders and healthcare systems.The IPS-DHW Profile leverages emerging international initiatives and national digital identity infrastructures, including:- WHO Smart Health Cards (SHC)- Japan My Number Card- Taiwan Digital Identity Wallet- Other national or regional digital wallet platformsFHIR IPS data is exchanged using QR codes or secure digital channels, with access strictly governed by explicit patient consent. Selective Disclosure JWT (SD-JWT) is used to enable privacy-preserving partial disclosure of IPS sections.## 3.1 IPS-DHW Actors, Transactions, and Content ModulesThis section defines the actors and transactions of the IPS-DHW Profile. To claim compliance with this profile, an actor shall support all required transactions (labeled \"R\") and may support the optional transactions (labeled \"O\").**Table 3.1-1: IPS-DHW Profile – Actors and Transactions**| Actor | Transaction | Optionality | Reference ||---|---|---|---|| IPS Issuer | Issue IPS Credential [IPS-W1] | R | Section 3.W1 ||  | Bind Patient Identity [IPS-W4] | O | Section 3.W4 || Health Wallet | Issue IPS Credential [IPS-W1] | R | Section 3.W1 ||  | Present IPS Credential [IPS-W2] | R | Section 3.W2 || IPS Verifier | Present IPS Credential [IPS-W2] | R | Section 3.W2 ||  | Verify IPS Credential [IPS-W3] | R | Section 3.W3 |### 3.1.1 Actor Descriptions and Actor Profile Requirements#### 3.1.1.1 IPS IssuerThe IPS Issuer packages a FHIR IPS document as a cryptographically signed verifiable credential and delivers it to the patient's Health Wallet via the Issue IPS Credential [IPS-W1] transaction. The IPS Issuer shall:- Produce a valid FHIR IPS Bundle conforming to the requirements of the IPSE Profile (Profile #2).- Sign the IPS credential using a recognized digital certificate or cryptographic key pair (e.g., RS256 or ES256 algorithms).- Encode the signed IPS as an SD-JWT or W3C Verifiable Credential format.- Deliver the IPS credential to the Health Wallet via a secure digital channel or QR code.- Optionally bind the IPS credential to a national digital identity (Bind Patient Identity [IPS-W4] – see National Identity Binding Option, Section 3.2.2).#### 3.1.1.2 Health WalletThe Health Wallet stores, manages, and presents the patient's IPS credentials. It acts as the patient's agent for controlled disclosure of health data across healthcare encounters and borders. The Health Wallet shall:- Receive and securely store IPS credentials issued by the IPS Issuer via Issue IPS Credential [IPS-W1].- Present IPS credentials to IPS Verifiers upon patient authorization via Present IPS Credential [IPS-W2], using either a QR code or a secure digital channel.- Support selective disclosure via SD-JWT, allowing the patient to share only the IPS sections requested by the IPS Verifier (see SD-JWT Option, Section 3.2.1).- Protect stored credentials using device-level security mechanisms (e.g., secure enclave, biometric access control).#### 3.1.1.3 IPS VerifierThe IPS Verifier receives and validates IPS credentials presented by patients via the Health Wallet, then retrieves the FHIR IPS content for clinical use. The IPS Verifier shall:- Request and receive IPS credentials from the Health Wallet via Present IPS Credential [IPS-W2].- Validate the digital signature of the IPS credential via Verify IPS Credential [IPS-W3].- Verify the certificate chain against a trusted IPS Issuer registry.- Enforce patient consent and selective disclosure policies (SD-JWT Option, Section 3.2.1).- Parse and render the FHIR IPS Bundle for clinical use.- Reject credentials with expired, revoked, or unverifiable signatures.## 3.2 IPS-DHW Actor OptionsOptions that may be selected for each actor are listed in Table 3.2-1.**Table 3.2-1: IPS-DHW – Actors and Options**| Actor | Option | Reference ||---|---|---|| IPS Issuer | SD-JWT Option | Section 3.2.1 ||  | National Identity Binding Option | Section 3.2.2 || Health Wallet | Offline QR Code Option | Section 3.2.3 ||  | National Identity Binding Option | Section 3.2.2 || IPS Verifier | SD-JWT Option | Section 3.2.1 |### 3.2.1 SD-JWT OptionActors that support this option shall implement Selective Disclosure JWT (SD-JWT) for privacy-preserving partial disclosure of IPS sections. The IPS Issuer shall encode each IPS section as a selectively disclosable claim in the SD-JWT. The Health Wallet shall generate a presentation proof disclosing only the claims requested by the IPS Verifier. The IPS Verifier shall verify SD-JWT presentation proofs and process only the disclosed claims.### 3.2.2 National Identity Binding OptionActors that support this option shall bind IPS credentials to a national digital identity infrastructure (e.g., Japan My Number Card, Taiwan Digital Identity Wallet). The IPS Issuer (with this option) binds the IPS credential to a verified national identity via Bind Patient Identity [IPS-W4]. The Health Wallet (with this option) links stored IPS credentials to the patient's national digital identity for cross-border trust establishment. This binding establishes trusted identity assurance levels required for international health data exchange.### 3.2.3 Offline QR Code OptionHealth Wallets that support this option shall encode the IPS credential as a QR code that can be scanned in offline (no network connectivity) environments. The QR code shall contain the complete signed IPS credential or a verifiable reference to it. IPS Verifiers shall be capable of scanning and decoding such QR codes without requiring a live network connection, enabling scenarios such as emergency care and disaster response.## 3.3 IPS-DHW Required Actor GroupingsAn actor from this profile shall implement required transactions in addition to all transactions required for the grouped actor.**Table 3.3-1: IPS-DHW Required Actor Groupings**| IPS-DHW Actor | Actor to be grouped with | Reference ||---|---|---|| IPS Issuer | IPS Creator (IPSE Profile) | Profile #2, Section 2.1.1.1 || IPS Issuer | ATNA / Secure Node | ITI TF-1: ATNA || IPS Verifier | CT / Time Client | ITI TF-1: Consistent Time |## 3.4 IPS-DHW Overview### 3.4.1 ConceptsThe IPS-DHW Profile shifts IPS exchange from system-to-system models toward a patient-centric interoperability paradigm. Key enabling technologies include:- **W3C Verifiable Credentials (VC)**: A data model for cryptographically verifiable, tamper-evident digital credentials.- **SD-JWT (Selective Disclosure JWT)**: A JWT-based mechanism that allows a credential holder to selectively disclose individual claims while maintaining cryptographic integrity.- **WHO Smart Health Cards (SHC)**: An open standard for encoding health data as signed, compact QR codes.- **Digital Health Wallet**: A patient-controlled application that stores, manages, and presents health credentials.- **National Digital Identity**: Country-specific digital identity infrastructure (e.g., Japan My Number Card, Taiwan Digital Identity Wallet) that provides certified identity assurance levels for credential binding.### 3.4.2 Use Cases**Use Case 1 – Cross-Border Travel and Emergency Care**A patient traveling abroad presents a QR code from their Health Wallet. The IPS Verifier scans the QR code, invokes Verify IPS Credential [IPS-W3] to validate the digital signature, and retrieves the FHIR IPS content after obtaining patient consent via Present IPS Credential [IPS-W2]. No prior system integration between the patient's home institution and the receiving provider is required.**Use Case 2 – Patient-Controlled Selective Sharing**Using the SD-JWT Option, a patient selectively discloses specific IPS sections (e.g., allergy list and current medications) while withholding other sensitive sections (e.g., mental health history). The Health Wallet generates a presentation proof containing only the requested claims. The IPS Verifier validates the proof and processes the disclosed content.**Use Case 3 – Outpatient or Referral Visit**Patients share their IPS credentials during first-time clinic visits without requiring pre-established system-to-system connectivity between healthcare institutions. The IPS credential, issued once by the IPS Issuer, is reused across multiple healthcare encounters.**Use Case 4 – Public Health or Disaster Response**Using the Offline QR Code Option, first responders and emergency care providers access patient IPS summaries via QR code scanning without network connectivity. The IPS Verifier validates the offline credential and retrieves the IPS content for immediate clinical use.**Use Case 5 – Integration with National Digital Identity Systems**Using the National Identity Binding Option, IPS credentials are bound to national identity wallets (e.g., Japan My Number Card, Taiwan Digital Identity Wallet) via Bind Patient Identity [IPS-W4]. This binding establishes trusted identity assurance for cross-border use and enables interoperability with national eHealth infrastructures.### 3.4.3 Process FlowThe following describes the general process flow for patient-mediated IPS exchange:1. The IPS Issuer (grouped with IPS Creator) creates a FHIR IPS Bundle conforming to the IPSE Profile (Profile #2) and packages it as a signed IPS credential.2. The IPS Issuer delivers the IPS credential to the patient's Health Wallet via Issue IPS Credential [IPS-W1] (QR code or secure digital channel).3. When the patient visits a healthcare provider, the patient authorizes the Health Wallet to present the IPS credential.4. The Health Wallet presents the IPS credential to the IPS Verifier via Present IPS Credential [IPS-W2] (QR code scan or secure digital channel).5. The IPS Verifier validates the credential signature and certificate chain via Verify IPS Credential [IPS-W3].6. The IPS Verifier retrieves the FHIR IPS content and processes it for clinical use.## 3.5 IPS-DHW Security Considerations- All credential issuance and verification shall use asymmetric cryptographic signing algorithms (e.g., RS256, ES256). The \"NONE\" algorithm shall not be used.- IPS Issuers shall maintain a publicly accessible key discovery endpoint (e.g., JWKS URI) to allow IPS Verifiers to retrieve signing key material.- Health Wallets shall protect stored credentials using device-level security mechanisms such as secure enclave storage and biometric or PIN-based access control.- IPS Verifiers shall validate the complete certificate chain against a trusted IPS Issuer registry before processing any IPS credential content.- Explicit patient consent shall be obtained before any credential presentation. Consent records should be logged for audit purposes.- SD-JWT nonce binding shall be used to prevent credential replay attacks.- IPS credentials shall include an expiration claim (`exp`). IPS Verifiers shall reject expired credentials.## 3.6 IPS-DHW Cross Profile ConsiderationsThe IPS-DHW Profile requires the IPSE Profile (Profile #2) for IPS content creation and structure. The IPS-DHW Profile interoperates with the following external specifications and frameworks:- **WHO Smart Health Cards (SHC)**: The Offline QR Code Option is designed to be compatible with the SHC encoding specification.- **W3C Verifiable Credentials Data Model**: The SD-JWT Option aligns with the W3C VC Data Model for cross-ecosystem interoperability.- **National Digital Identity Frameworks**: The National Identity Binding Option supports integration with country-specific identity infrastructures (My Number, Taiwan Digital ID, EU eID, and similar).- **IHE ATNA Profile**: IPS Issuers shall audit credential issuance events. IPS Verifiers shall audit credential verification and IPS access events.- **AP IPS Governance Models**: The IPS-DHW Profile is intended to harmonize with Asia-Pacific IPS governance frameworks and international regulatory requirements for cross-border health data sharing.Future directions include deeper alignment with W3C Verifiable Credentials, broader adoption of SD-JWT and privacy-enhancing technologies, interoperability testing between health wallets and national identity wallets, and expansion to support additional FHIR-based health artifacts (e.g., immunization records, imaging summaries).![IPS Digital Health Wallet](../assets/images/track3-wallet.jpg)---[← Back to Themes](/en/themes)"

<script>
  const pages = JSON.parse(document.getElementById('searchData').textContent || '[]');

  function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlightMatch(text, query) {
    if (!query || !text) return text || '';
    const regex = new RegExp(escapeRegExp(query), 'gi');
    return text.replace(regex, (match) => `<mark class="search-hit">${match}</mark>`);
  }

  function getSnippet(content, query, radius = 80) {
    if (!content) return '';
    const lower = content.toLowerCase();
    const q = query.toLowerCase();
    const idx = lower.indexOf(q);
    if (idx === -1) {
      return content.substring(0, 180) + (content.length > 180 ? '...' : '');
    }
    const start = Math.max(0, idx - radius);
    const end = Math.min(content.length, idx + q.length + radius);
    const prefix = start > 0 ? '...' : '';
    const suffix = end < content.length ? '...' : '';
    return prefix + content.substring(start, end) + suffix;
  }

  function updateSuggestions() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const suggestionsContainer = document.getElementById('searchSuggestions');
    suggestionsContainer.innerHTML = '';

    if (!query.trim()) {
      suggestionsContainer.style.display = 'none';
      return;
    }

    const suggestions = pages.filter(page =>
      (page.title || '').toLowerCase().includes(query) ||
      (page.content || '').toLowerCase().includes(query)
    ).slice(0, 5);

    if (suggestions.length > 0) {
      suggestions.forEach(suggestion => {
        const suggestionItem = document.createElement('div');
        const title = highlightMatch(suggestion.title || '', query);
        suggestionItem.innerHTML = `<a href="${suggestion.url}">${title}</a>`;
        suggestionsContainer.appendChild(suggestionItem);
      });
      suggestionsContainer.style.display = 'block';
    } else {
      suggestionsContainer.innerHTML = '<p>No suggestions found.</p>';
      suggestionsContainer.style.display = 'block';
    }
  }

  function performSearch() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const resultsContainer = document.getElementById('searchResults');
    resultsContainer.innerHTML = '';

    if (!query.trim()) {
      resultsContainer.classList.remove('active');
      return;
    }

    const results = pages.filter(page =>
      (page.title || '').toLowerCase().includes(query) ||
      (page.content || '').toLowerCase().includes(query)
    );

    if (results.length > 0) {
      const heading = document.createElement('h3');
      heading.textContent = `Search results for "${query}" (${results.length})`;
      resultsContainer.appendChild(heading);

      results.forEach(result => {
        const previewRaw = getSnippet(result.content || '', query, 80);
        const preview = highlightMatch(previewRaw, query);
        const title = highlightMatch(result.title || '', query);
        const resultItem = document.createElement('div');
        resultItem.className = 'search-result';
        resultItem.innerHTML = `<a href="${result.url}">${title}</a><p>${preview}</p>`;
        resultsContainer.appendChild(resultItem);
      });
      resultsContainer.classList.add('active');
    } else {
      const noResultsMsg = document.createElement('p');
      noResultsMsg.textContent = 'No results found.';
      resultsContainer.appendChild(noResultsMsg);
      resultsContainer.classList.add('active');
    }
  }

  document.getElementById('searchInput').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      performSearch();
    }
  });

  function toggleMenu() {
    const menu = document.getElementById('navbarMenu');
    const button = document.querySelector('.navbar-toggle');
    const isOpen = menu.classList.toggle('is-open');
    if (button) {
      button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
  }

  window.addEventListener('resize', () => {
    const menu = document.getElementById('navbarMenu');
    const button = document.querySelector('.navbar-toggle');
    if (!menu || !button) return;
    if (window.innerWidth > 900) {
      menu.classList.remove('is-open');
      button.setAttribute('aria-expanded', 'false');
    }
  });

  // 圖片放大功能
  document.addEventListener('DOMContentLoaded', function() {
    // 創建模態框
    const modal = document.createElement('div');
    modal.className = 'image-modal';
    modal.id = 'imageModal';
    modal.innerHTML = '<span class="image-modal-close">&times;</span><img id="modalImage" src="" alt="">';
    document.body.appendChild(modal);

    const modalImg = document.getElementById('modalImage');
    const closeBtn = modal.querySelector('.image-modal-close');

    // 為所有內容區域的圖片添加點擊事件
    const contentImages = document.querySelectorAll('.content img');
    contentImages.forEach(img => {
      img.addEventListener('click', function() {
        modal.style.display = 'block';
        modalImg.src = this.src;
        modalImg.alt = this.alt;
      });
    });

    // 關閉模態框
    function closeModal() {
      modal.style.display = 'none';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal || e.target === modalImg) {
        closeModal();
      }
    });

    // ESC 鍵關閉
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.style.display === 'block') {
        closeModal();
      }
    });
  });
</script>
